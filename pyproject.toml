[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# The repository's own alembic/ directory holds the migrations, not the
# package; ruff versions disagree on which section `from alembic...` sorts
# into without this.
[tool.ruff.lint.isort]
known-third-party = ["alembic"]
