# Canonical, production-shape configuration: the app runs exactly what the
# image contains, with no dependency on the host filesystem.
#
# `docker compose up` in a checkout also picks up docker-compose.override.yml,
# which bind-mounts ./app over the image for live reload. That is a local-dev
# convenience and nothing else should rely on it. To run this file alone, as
# CI and any real deployment do, pass it explicitly:
#
#     docker compose -f docker-compose.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://ledger:ledger@db:5432/ledger
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Asserts the same thing CI does: a 200 from /health whose body reports a
    # live database, so a container whose migrations failed is never reported
    # healthy. Uses python rather than curl/wget because the image is
    # python:3.12-slim, which ships neither (see the README's dev-mode section).
    # start_period covers `alembic upgrade head` running before uvicorn binds.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, json, urllib.request
          with urllib.request.urlopen("http://localhost:8000/health", timeout=3) as r:
              sys.exit(0 if json.load(r) == {"status": "ok", "db": "up"} else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
